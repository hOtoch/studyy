[project]
name = "studyy"
version = "0.1.0"
description = "Sistema pessoal de estudos: anotacoes, roadmap, pomodoro e progressao"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyy"]

# ---------------------------------------------------------------------------
# Ruff: substitui flake8 + isort + black
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# O ruff 0.16 formata blocos ```python dentro de Markdown. Os snippets do
# ROADMAP.md sao ilustrativos e compactados de proposito (varias classes em
# uma linha, comentarios alinhados). Deixar a ferramenta "consertar" isso
# destruiria a legibilidade do documento sem ganho nenhum: markdown nao e codigo.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TCH",      # type-checking imports
    "PTH",      # usar pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Migrations sao geradas pelo Alembic. O template deixa espaco no fim da linha
# "Revises:" quando nao ha revisao anterior, e nao vale editar codigo gerado
# a cada migration so por isso.
"alembic/versions/*" = ["W291"]

# ---------------------------------------------------------------------------
# mypy: o "compilador" que o Python nao tem
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: exige Postgres rodando",
]
