name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # O Postgres do CI e um servico efemero, nao o docker-compose local.
    # Mesma versao de imagem para nao descobrir incompatibilidade so no deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyy
          POSTGRES_PASSWORD: studyy
          POSTGRES_DB: studyy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyy -d studyy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://studyy:studyy@localhost:5432/studyy

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-groups

      # A ordem importa: o mais rapido falha primeiro.
      # Feedback de 3 segundos vale mais que feedback de 3 minutos.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy

      - name: Testes
        run: uv run pytest
